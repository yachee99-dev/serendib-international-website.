name: Restore Serendib V9 website folders

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore original folder tree from existing developer ZIP
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          archive=pathlib.Path("Serendib_V9_Developer_Source.zip")
          if not archive.is_file():
              raise SystemExit("Developer ZIP missing at repository root")
          with zipfile.ZipFile(archive) as z:
              for member in z.infolist():
                  path=pathlib.PurePosixPath(member.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Unsafe archive entry: "+member.filename)
                  if member.filename.startswith(("site/","functions/","migrations/","qa/")) or member.filename == ".github/workflows/quality.yml":
                      z.extract(member, ".")
          for needed in ("site/index.html","functions/api/enquiry.js",
                         "site/assets/products/ceylon-cinnamon-hero.webp",
                         "site/assets/fonts/open-sans-semibold.woff"):
              assert pathlib.Path(needed).is_file(), "Missing "+needed
          print("Restored site, media, fonts, Functions and tests.")
          PY
      - name: Commit restored tree to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site functions migrations qa .github/workflows/quality.yml
          if ! git diff --staged --quiet; then
            git commit -m "Restore V9 Pages directory structure and media assets"
            git push origin HEAD:main
          else
            echo "Files already restored; nothing to commit."
          fi
